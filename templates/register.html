{% extends 'base.html' %}{% block title %}Student registration{% endblock %}{% block content %}<div class="form-page"><div class="eyebrow">GET STARTED</div><h1>Create your student account</h1><p class="muted">Your class and division determine which lectures you can see.</p><form class="panel form-grid" method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>Full name<input name="name" required></label><label>Username<input name="username" required autocomplete="username"></label><label>Password <small>(8+ characters)</small><input name="password" type="password" minlength="8" required autocomplete="new-password"></label><label>Roll number<input name="roll_number" required></label><label>Class<input name="class_name" required placeholder="e.g. FYCS"></label><label>Division<input name="division" required placeholder="e.g. A"></label><div><button class="btn primary">Create account →</button></div><p class="span2 muted">Teacher accounts are created by the demo setup.</p></form></div>{% endblock %}
